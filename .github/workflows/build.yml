# ============================================================
#  推上来就自动编译三样东西
#
#    · 安卓 APK     —— ubuntu + JDK 17 + Android SDK 34
#    · 网页后台 exe —— windows + PyInstaller 单文件
#    · 最小容器镜像 —— ubuntu + docker build（Alpine 多阶段，约 70MB），
#                     推到 GitHub Packages（ghcr.io），NAS 上 docker pull 就能用；
#                     同时也导出成 tar.gz，供拉不通 ghcr.io 的场合走「从文件添加」
#
#  另外顺手跑服务端自测。这一条有个额外价值：runner 是 Linux，
#  跟群晖 NAS 是同一个环境，所以「能不能在 Linux 上跑」不用等到
#  真机上才发现。
#
#  ── 怎么用 ──────────────────────────────────────────────
#  平时：改完 push 到 main，自动编译。结果在仓库的 Actions 页看，
#        产物在该次运行页面下方的 Artifacts 里下载（要登录）。
#  发版：打一个 v 开头的 tag 推上来，会自动建 Release 并把产物
#        挂出去（Release 附件谁都能直接下载，不用登录）：
#            git tag v0.3.9 && git push origin v0.3.9
#  手动：Actions 页面选这个工作流 -> Run workflow。
#
#  ── 踩过的坑（改这个文件之前先看）─────────────────────────
#  1. Windows runner 是英文系统，Python 打印中文到管道会 UnicodeEncodeError。
#     所以下面统一设 PYTHONIOENCODING / PYTHONUTF8，脚本自己也做了保护。
#  2. 别用 android-actions/setup-android：它是 Node 20 时代的，runner 升到
#     Node 24 之后跑不起来。runner 上本来就装了 Android SDK，直接用。
#  3. action 版本要跟着官方 README 走（现在都是最新 major），老版本会被
#     runner 强制用新 Node 跑，行为不稳。
# ============================================================

name: 构建

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读。需要提权的两个 job 各自声明：
#   · 推容器镜像 -> packages: write
#   · 发 Release  -> contents: write
# 注意 job 级的 permissions 会**整个覆盖**这里，所以那边得把 contents 也写上。
permissions:
  contents: read

# Windows 上不给这个，Python 一 print 中文就崩（见上面坑 #1）
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

# 同一个分支连着推两次，把前一次没跑完的取消掉，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  #  1) 安卓 APK
  # ----------------------------------------------------------
  apk:
    name: 安卓 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      - name: 装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 准备 Android SDK 34
        run: |
          # runner 上本来就有 Android SDK，这里只是找到它、把我们要的版本补上。
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMGR" ]; then
            echo "::error title=找不到 sdkmanager::SDK 目录是 $SDK，里面的东西：$(ls "$SDK" 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          echo "用的 sdkmanager：$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "———— 现在装了这些 ————"
          "$SDKMGR" --list_installed | head -15

      - name: 读出本次版本号
        id: ver
        run: |
          V=$(grep -oP '^val appVersionName = "\K[^"]+' app/build.gradle.kts)
          C=$(grep -oP '^val appVersionCode = \K[0-9]+' app/build.gradle.kts)
          if [ -z "$V" ] || [ -z "$C" ]; then
            echo "::error title=读不出构建版本号::app/build.gradle.kts 开头那两行 appVersionName / appVersionCode 是不是被改坏了"
            exit 1
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "本次版本：$V ($C)"

      # 为什么要这一步：AGP 默认的 debug 签名是「每台机器各自生成一个」。
      # 不固定的话，CI 打的 APK 和你在本机 build.bat 打的 APK 签名不同，
      # 装在同一个电视上会互相覆盖不了（系统只报「应用未安装」，看不出原因）。
      # 把本机那个 debug.keystore 存成仓库 secret，两边就一致了。
      - name: 装上固定签名
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "已装入固定的 debug keystore —— 这个 APK 能和本机构建的互相覆盖安装"
          else
            echo "::notice title=用的是临时签名::没配 DEBUG_KEYSTORE_BASE64，APK 能装能跑，但不能覆盖本机构建的那个（换着装要先卸载）。想固定签名见 docs/ci.md。"
          fi

      - name: 编译 debug APK
        run: |
          set -o pipefail
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log; then
            echo "———— 编译失败，关键几行 ————"
            KEY=$(grep -nE "^e: |error:|What went wrong|Execution failed|Could not|FAILURE:" gradle.log | head -8 || true)
            echo "$KEY"
            # 打成注解：这是不需要登录 GitHub 也能读到的通道（日志要登录）
            printf '%s\n' "$KEY" | grep -v '^$' | sed 's/%/%25/g; s/\r$//' \
              | while IFS= read -r l; do echo "::error title=gradle::${l}"; done
            echo "———— 最后 20 行 ————"
            tail -20 gradle.log
            exit 1
          fi

      - name: 顺便跑 lint（只报告，不拦构建）
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon

      - name: 看看产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: signage-apk-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------
  #  2) 网页后台 exe
  # ----------------------------------------------------------
  exe:
    name: 网页后台 exe
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # boto3 是「要用对象存储模式」才需要的，但既然要打 exe，就一起打进去，
      # 免得在别的电脑上才发现 s3 模式用不了
      - name: 装 PyInstaller 和 boto3
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller boto3
          python -c "import PyInstaller, boto3; print('PyInstaller', PyInstaller.__version__, '| boto3', boto3.__version__)"

      # 这一步里带的 19 项冒烟测试才是重点：它会把 exe 真启动起来，
      # 验网页能打开（证明 web/ 打进包了）、数据落在 exe 旁边（不是临时解包目录）。
      # 这两种毛病编译期都看不出来，只有真跑一次才现形。
      - name: 打包 + 冒烟测试
        shell: bash
        run: |
          set -o pipefail
          cd server
          if ! python build-exe.py --work "$RUNNER_TEMP/pi-work" --dist "$RUNNER_TEMP/pi-dist" 2>&1 | tee build-exe.log; then
            echo "———— 打包/冒烟失败，关键几行 ————"
            KEY=$(grep -nE "Traceback|Error|error:|失败|没通过|！|X " build-exe.log | head -8 || true)
            echo "$KEY"
            printf '%s\n' "$KEY" | grep -v '^$' | sed 's/%/%25/g; s/\r$//' \
              | while IFS= read -r l; do echo "::error title=build-exe::${l}"; done
            echo "———— 最后 25 行 ————"
            tail -25 build-exe.log
            exit 1
          fi

      - name: 上传 exe
        uses: actions/upload-artifact@v7
        with:
          name: signage-admin-exe
          path: server/dist/
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------
  #  3) 服务端自测
  #     价值：runner 是 Linux，跟群晖同一个环境。
  #     check-deploy.py 会按 Dockerfile 里的 COPY 清单搭一份一模一样的
  #     目录布局再起真服务 —— 漏拷文件当场暴露，不用等到 NAS 上。
  # ----------------------------------------------------------
  server-tests:
    name: 服务端自测（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      - name: 装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 装依赖
        run: python -m pip install boto3 pyyaml

      - name: 服务端自测
        working-directory: server
        run: python selftest.py

      - name: 部署自检
        working-directory: server
        run: python check-deploy.py

  # ----------------------------------------------------------
  #  4) 最小容器镜像
  #     这是**唯一真 build 镜像、真起容器**的地方。check-deploy.py 是按 COPY
  #     清单在临时目录里模拟布局，证明不了这三件事：Alpine 上 boto3 装得动、
  #     多阶段拷贝没拷错位置、容器里页面真能打开。这三样都得真跑一次才算数。
  #
  #     冒烟过了才往 ghcr.io 推（先验后发，坏镜像推上去不如不推）。推三个 tag：
  #         latest ／ <服务端版本> ／ sha-<短SHA>
  #     只有 sha- 那个**不可变**，想钉死某一版就用它；latest 和版本号都跟着
  #     main 走，每次 push 覆盖同名 tag（所以 compose 里写 :版本号 会跟着升）。
  #     PR 上只构建不推送 —— fork 过来的 PR 拿不到包写权限，推了必红。
  #
  #     **多架构**：每个 tag 下同时挂 linux/amd64 和 linux/arm64，一个 manifest
  #     list。x86 的群晖（DS220+、DS920+ 这些）拉 amd64、ARM 的（DS223j、DS124
  #     这些）拉 arm64，NAS 上不用做任何选择，compose 里也**不要**写 platform。
  #     代价是 arm64 那条要 qemu 模拟着跑 apk/pip，构建慢一两分钟。
  # ----------------------------------------------------------
  docker:
    name: 容器镜像（最小）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 顶层是只读，这里要推包得显式提权。job 级的 permissions 是**覆盖**不是合并，
    # 所以 contents 必须重写一遍
    permissions:
      contents: read
      packages: write

    steps:
      - name: 取代码
        uses: actions/checkout@v7

      - name: 读出服务端版本号
        id: ver
        run: |
          V=$(grep -oP '^ADMIN_VERSION\s*=\s*"\K[^"]+' server/signage_admin.py)
          if [ -z "$V" ]; then
            echo "::error title=读不出版本号::server/signage_admin.py 里的 ADMIN_VERSION 那行是不是被改坏了"
            exit 1
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本：$V"

      # 多架构要两样东西：qemu（让 amd64 的 runner 能跑 arm64 的 apk / pip
      # 这些真二进制）+ buildx（把一个 tag 指向多份不同架构的镜像）。
      # qemu 必须放在 buildx 前面 —— builder 建好之后才注册的解释器它不认。
      - name: 装 qemu（跨架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 建 buildx builder
        uses: docker/setup-buildx-action@v3

      - name: 构建最小镜像（amd64，先留本地给冒烟用）
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -o pipefail
          # 这一步只出 amd64：下面冒烟要真起容器，arm64 得靠 qemu 模拟着跑，
          # 跑得起来也不能代表 ARM 真机没问题，不如交给 NAS 去验。arm64 那条
          # 在推送那步一起构建，同一个 buildx、缓存复用，不会白跑一遍。
          if ! docker buildx build \
                 --platform linux/amd64 \
                 --load \
                 --cache-from type=gha,scope=signage-min \
                 --cache-to type=gha,mode=max,scope=signage-min \
                 -f server/Dockerfile.min \
                 -t "signage-admin:min-$V" . 2>&1 | tee docker-build.log; then
            echo "———— 构建失败，关键几行 ————"
            KEY=$(grep -nE "^ERROR|error:|Error|failed|not found" docker-build.log | head -8 || true)
            echo "$KEY"
            printf '%s\n' "$KEY" | grep -v '^$' | sed 's/%/%25/g; s/\r$//' \
              | while IFS= read -r l; do echo "::error title=docker build::${l}"; done
            echo "———— 最后 30 行 ————"
            tail -30 docker-build.log
            exit 1
          fi

      # 构建成功只说明镜像能出来。web/ 没进镜像、boto3 拷错位置这些毛病，
      # 表现都是「镜像正常、服务照跑、只是页面 404 / COS 用不了」，
      # 所以下面必须真起容器、真发请求、真 exec 进去看一眼。
      - name: 真起容器跑一遍
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          IMG="signage-admin:min-$V"
          NAME=smoke
          PORT=18600

          docker run -d --name "$NAME" --platform linux/amd64 -p "$PORT:8600" "$IMG" > /dev/null

          up=""
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" > /dev/null 2>&1; then up=1; break; fi
            # 容器自己退了就别再等
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME" 2>/dev/null)" != "true" ]; then break; fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error title=容器起不来::docker run 之后 30 秒内 /api/health 没通"
            echo "———— 容器日志 ————"
            docker logs "$NAME" 2>&1 | tail -40
            exit 1
          fi
          echo "容器起来了，逐条验："

          bad=0
          chk() {                     # chk <说明> <命令…>
            local desc="$1"; shift
            local out=""
            if out=$("$@" 2>&1); then
              echo "  ok   $desc"
            else
              echo "  FAIL $desc"
              printf '%s\n' "$out" | tail -6
              echo "::error title=容器冒烟失败::$desc"
              bad=1
            fi
          }

          chk "探活接口通" curl -fsS "http://127.0.0.1:$PORT/api/health"
          chk "页面能打开（web/ 进镜像了）" \
            sh -c "curl -fsS http://127.0.0.1:$PORT/ | grep -qi '<html'"
          chk "静态资源能取到（web/app.js）" \
            curl -fsS -o /dev/null "http://127.0.0.1:$PORT/app.js"
          chk "镜像里能 import boto3（多阶段拷贝对了）" \
            docker exec "$NAME" python3 -c "import boto3; print(boto3.__version__)"
          chk "镜像里能找到 tools/signage_core.py" \
            docker exec "$NAME" python3 -c "import sys; sys.path.insert(0, '/app/tools'); import signage_core"
          chk "时区是 CST（tzdata 装上了）" \
            sh -c "test \"$(docker exec $NAME date +%Z)\" = CST"
          chk "自报版本跟代码里一致" \
            sh -c "docker exec $NAME python3 /app/server/signage_admin.py --version | grep -qF '$V'"

          echo "———— 容器日志 ————"
          docker logs "$NAME" 2>&1 | tail -15
          docker rm -f "$NAME" > /dev/null

          if [ "$bad" != "0" ]; then
            echo "::error title=容器冒烟有失败项::上面标 FAIL 的那几条就是"
            exit 1
          fi
          echo "容器冒烟全过"

      - name: 体积（跟原版那份比）
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          # 原版那份以前只被 check-deploy.py「模拟」验过，这里第一次真 build。
          # 它 build 不过说明群晖现场构建那条路是坏的，所以也算失败，不忽略。
          docker buildx build --platform linux/amd64 --load \
            -f server/Dockerfile -t signage-admin:slim . > /dev/null

          mb() { docker image inspect "$1" --format '{{.Size}}' | awk '{printf "%.1f MB", $1/1048576}'; }
          MIN_MB=$(mb "signage-admin:min-$V")
          SLIM_MB=$(mb signage-admin:slim)
          echo "最小镜像 $MIN_MB ／ 原版 $SLIM_MB"

          {
            echo "### 容器镜像体积"
            echo
            echo "| 镜像 | 基础镜像 | 未压缩 |"
            echo "|---|---|---|"
            echo "| \`signage-admin:min-$V\` | python:3.12-alpine | $MIN_MB |"
            echo "| \`signage-admin:slim\` | python:3.12-slim | $SLIM_MB |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 先起容器验过再推 —— 推上去就是对外发布状态，坏镜像推上去比不推更麻烦
      - name: 构建两个架构并推到 GitHub Packages（ghcr.io）
        if: github.event_name != 'pull_request'
        env:
          V: ${{ steps.ver.outputs.name }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ghcr 的镜像名必须全小写，仓库名万一有大写字母在这儿拉平
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)

          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # 一次构建两个架构，buildx 自动生成 manifest list：同一个 tag 下挂着
          # amd64 和 arm64 两份，NAS 拉的时候按自己的 CPU 自动挑，compose 里
          # **不用**也不该写 platform。
          #
          # 为什么不用 `FROM --platform=$BUILDPLATFORM` 那种提速写法（在 runner
          # 原生机上装 boto3、再拷进 arm64 镜像）：boto3 现在是纯 Python 才碰巧
          # 能跨架构拷，哪天它的依赖链里进了 C 扩展，就会静默往 arm64 镜像里
          # 拷一份 amd64 的 .so —— 构建照过，NAS 上 import 才炸。不值得为省
          # 一两分钟埋这个雷。
          #
          # --provenance=false 是必须的：buildx 默认会往里塞 attestation
          # manifest，manifest list 里会多出两条 unknown/unknown。老版本
          # Docker（群晖上常见的那些）遇到不认识的平台会直接报
          # "no matching manifest for linux/amd64" —— 包明明在，就是拉不动，
          # 报错还完全指不到真正原因。
          set +e
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --cache-from type=gha,scope=signage-min \
            -f server/Dockerfile.min \
            -t "$REPO:latest" \
            -t "$REPO:$V" \
            -t "$REPO:sha-$SHORT" \
            --push . > push.log 2>&1
          RC=$?
          set -e
          tail -25 push.log
          if [ "$RC" != "0" ]; then
            echo "::error title=docker push::多架构构建或推送失败，退出码 $RC"
            echo "———— 关键几行 ————"
            KEY=$(grep -nE "denied|unauthorized|forbidden|ERROR|error|no such|no matching" push.log | head -8 || true)
            echo "$KEY"
            echo ""
            echo "多半是这几件事之一："
            echo "  1) 仓库 Settings → Actions → General → Workflow permissions 没选 Read and write"
            echo "  2) 这个命名空间下以前推过同名包、但没关联到仓库，于是 GITHUB_TOKEN 没权限"
            echo "  3) arm64 那条在 qemu 下跑挂了（装 boto3 那步）—— 把 --platform 里的"
            echo "     arm64 临时去掉能确认是不是这个原因"
            exit 1
          fi
          echo "已推三个 tag，每个都是 amd64 + arm64"

          {
            echo ""
            echo "### 容器镜像已发布到 GitHub Packages"
            echo ""
            echo "**多架构**：每个 tag 下同时有 \`linux/amd64\` 和 \`linux/arm64\` 两份，"
            echo "NAS 会按自己的 CPU 自动选，compose 里不用写 platform。"
            echo ""
            echo '```'
            echo "docker pull $REPO:$V"
            echo "docker pull $REPO:latest"
            echo "docker pull $REPO:sha-$SHORT   # 这一版钉死在这次提交上"
            echo '```'
            echo ""
            echo "包名 \`${GITHUB_REPOSITORY#*/}\`，在仓库右侧的 Packages 区能看到。"
            echo "**这个是公开包，匿名就能拉**（GitHub 文档说首次默认 private，但公开仓库"
            echo "从 workflow 推的包实测是公开的）。万一拉不动，两个可能："
            echo "  1) 包被设成 private 了 -> Package settings → Danger Zone → Change visibility"
            echo "  2) 网络到不了 ghcr.io（国内常见）-> 用 Release 里的 tar.gz 导入"
            echo "真要登录：docker login ghcr.io -u <用户名>，密码填有 read:packages 的 PAT。"
            echo ""
            echo "想确认某个 tag 里到底有哪几个架构：\`docker buildx imagetools inspect $REPO:$V\`"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "### 容器镜像已发布到 GitHub Packages"
            echo ""
            echo '```'
            echo "docker pull $REPO:$V"
            echo "docker pull $REPO:latest"
            echo "docker pull $REPO:sha-$SHORT   # 这一版钉死在这次提交上"
            echo '```'
            echo ""
            echo "包名 \`${GITHUB_REPOSITORY#*/}\`，在仓库右侧的 Packages 区能看到。"
            echo "**这个是公开包，匿名就能拉**（GitHub 文档说首次默认 private，但公开仓库"
            echo "从 workflow 推的包实测是公开的）。万一拉不动，两个可能："
            echo "  1) 包被设成 private 了 -> Package settings → Danger Zone → Change visibility"
            echo "  2) 网络到不了 ghcr.io（国内常见）-> 用 Release 里的 tar.gz 导入"
            echo "真要登录：docker login ghcr.io -u <用户名>，密码填有 read:packages 的 PAT。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 推完必须回头看一眼 manifest —— 「推送成功」只说明 HTTP 通了，说明不了
      # 两个架构真都在里面。少一个架构，得等对应型号的 NAS 去拉才会现，那时候
      # 包已经对外发布了。attestation 那条同理（它会让老 Docker 拉不动）。
      - name: 验 manifest 里两个架构都在
        if: github.event_name != 'pull_request'
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "$REPO:$V" | tee manifest.txt

          bad=0
          for A in linux/amd64 linux/arm64; do
            if grep -q "Platform: *$A" manifest.txt; then
              echo "  ok   manifest 里有 $A"
            else
              echo "  FAIL manifest 里没有 $A"
              echo "::error title=manifest 缺架构::这次推上去的包里没有 $A 那一份"
              bad=1
            fi
          done
          if grep -qi "unknown/unknown" manifest.txt; then
            echo "  FAIL manifest 里有 unknown/unknown（attestation 没关掉，老 Docker 会拉不动）"
            echo "::error title=manifest 带 attestation::检查 --provenance=false 还在不在"
            bad=1
          fi
          [ "$bad" = "0" ] || exit 1

          {
            echo ""
            echo "### 镜像 manifest（一个 tag，两个架构）"
            echo ""
            echo '```'
            grep -E "^(Name|Digest):|Platform:" manifest.txt || cat manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "manifest 验证通过"

      - name: 导出镜像（群晖「映像 → 新增 → 从文件添加」直接用）
        env:
          V: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          # save 进去的 tag 必须跟 docker-compose.min.yml 里 image: 写的一致，
          # 不然从 tar.gz 导进 NAS 之后镜像名对不上，容器起不来。
          #
          # 一个架构出一份文件。为什么不能一次 save 两个：docker save 只认本地
          # 镜像，而本地同一个 tag 只能存一个架构 —— 后拉的会把先拉的顶掉。
          # 所以必须「拉一份 → 存一份 → 删掉 tag」轮着来。
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR 上没推 ghcr，只有本地 --load 出来的那份 amd64。产物本来也不上
            # Release，这里只保证脚本能跑通，别去找一个不存在的包。
            echo "（PR：没推 ghcr，只导本地这份 amd64，产物本来也不上 Release）"
            docker tag "signage-admin:min-$V" "$REPO:$V"
            F="signage-admin-docker-amd64-$V.tar.gz"
            docker save "$REPO:$V" | gzip -9 > "$F"
            echo "  amd64 -> $F  $(du -h "$F" | cut -f1)"
          else
            for A in amd64 arm64; do
              if ! docker pull -q --platform "linux/$A" "$REPO:$V" > /dev/null 2>&1; then
                # 这里**故意不兜底**。上一步刚说推成功了，这会儿却拉不到，
                # 说明 manifest 或网络有问题 —— 该报警。要是拿本地那份 amd64
                # 顶上去改个文件名了事，NAS 上导进 ARM 机器才发现架构不对
                # （exec format error），比直接红难查得多。
                echo "::error title=导出镜像::ghcr 上拉不到 $A 那一份，而上一步显示推送成功了"
                echo "———— 直接拉一次看报什么 ————"
                docker pull --platform "linux/$A" "$REPO:$V" 2>&1 | tail -12 || true
                echo ""
                echo "两个可能："
                echo "  1) manifest 里少了这个架构（去那次运行的 Summary 看有没有 $A）"
                echo "  2) 网络到 ghcr.io 抽了一下 —— 重跑一次通常就好"
                exit 1
              fi
              F="signage-admin-docker-$A-$V.tar.gz"
              docker save "$REPO:$V" | gzip -9 > "$F"
              echo "  $A -> $F  $(du -h "$F" | cut -f1)"
              # 不删掉，下一轮 pull 另一个架构会因为 tag 已被占用而不更新
              docker image rm -f "$REPO:$V" > /dev/null 2>&1 || true
            done
          fi

          ls -lh signage-admin-docker-*.tar.gz
          TARS=$(du -ch signage-admin-docker-*.tar.gz | tail -1 | cut -f1)
          {
            echo ""
            echo "**导出成 tar.gz：共 $TARS**（两个架构各一份，NAS 按 CPU 挑）"
            echo ""
            echo '```'
            ls -1 signage-admin-docker-*.tar.gz
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传镜像和部署文件
        uses: actions/upload-artifact@v7
        with:
          name: signage-admin-docker-${{ steps.ver.outputs.name }}
          path: |
            signage-admin-docker-*.tar.gz
            server/docker-compose.min.yml
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------
  #  5) 打 tag 时发 Release（产物挂成附件，谁都能直接下）
  # ----------------------------------------------------------
  release:
    name: 发 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, exe, docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 把两个 job 的产物收下来
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 每个 artifact 落在 dist/ 下的一个子目录里，用 find 收拢，
          # 不依赖 download-artifact 的参数名（那些跨大版本会变）
          find dist -type f -printf '%s\t%p\n' | sort -rn
          mapfile -t FILES < <(find dist -type f | sort)
          echo "共 ${#FILES[@]} 个文件"
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "门店屏 $GITHUB_REF_NAME" \
            --notes '自动构建产物：

          - signage-*.apk —— 安卓电视端，拷进电视安装（minSdk 21，老电视也能装）
          - signage-admin.exe —— 网页后台（Windows），双击运行，第一次要放行防火墙
          - signage-server.example.json —— 后台启动配置模板，改名成 signage-server.json 放在 exe 旁边就生效
          - 容器镜像也可以直接拉（不用下 tar.gz，NAS 上执行）：
              docker pull ghcr.io/binhe-cpu/signage-tv:latest
            这个包是**多架构**的，x86 的群晖和 ARM 的群晖用同一个 tag，自动按 CPU 选。
          - signage-admin-docker-amd64-*.tar.gz / signage-admin-docker-arm64-*.tar.gz
            —— 最小容器镜像（Alpine，约 70MB），两个架构各一份。留给拉不通 ghcr.io
            的场合：**先看清你的 NAS 是哪种 CPU**，下对应那份，传到群晖
            「Container Manager → 映像 → 新增 → 从文件添加」，再配 docker-compose.min.yml
          - docker-compose.min.yml —— 上面那个镜像的群晖部署文件。**注意它不挂代码目录**，
            代码在镜像里，只需要建 data/ 和 site/ 两个空目录

          编译环境：JDK 17 + Android SDK 34 + Gradle 8.7；Python 3.12 + PyInstaller；
          Docker（Alpine 3.12 多阶段构建）。'
